services:
  palworld:
    image: thijsvanloef/palworld-server-docker:${PALWORLD_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      PORT: "${SERVER_PORT}"
      PLAYERS: "${PLAYERS}"
      ENABLE_PERF_THREADING_ARGS: "${ENABLE_PERF_THREADING_ARGS}"
      WORKER_THREADS_SERVER: "${WORKER_THREADS_SERVER}"
      SERVER_NAME: "${SERVER_NAME}"
      SERVER_DESCRIPTION: "${SERVER_DESCRIPTION}"
      SERVER_PASSWORD: "${SERVER_PASSWORD}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      COMMUNITY: "${COMMUNITY}"
      CROSSPLAY_PLATFORMS: "${CROSSPLAY_PLATFORMS}"
      RCON_ENABLED: "${RCON_ENABLED}"
      RCON_PORT: "${RCON_PORT}"
      AUTO_UPDATE_ENABLED: "${AUTO_UPDATE_ENABLED}"
      UPDATE_ON_BOOT: "${UPDATE_ON_BOOT}"
      BACKUP_ENABLED: "${BACKUP_ENABLED}"
      BACKUP_CRON_EXPRESSION: "${BACKUP_CRON_EXPRESSION}"
      DELETE_OLD_BACKUPS: "${DELETE_OLD_BACKUPS}"
      OLD_BACKUP_DAYS: "${OLD_BACKUP_DAYS}"
    ports:
      - "${SERVER_PORT}:8211/udp"
      - "${RCON_PORT}:25575/tcp"
    volumes:
      - "${DATA_PATH}:/palworld"

  arcade-adapter:
    build:
      context: ./arcade
      # Bust the pip-install layer to actually pick up new lib-arcade
      # commits -- requirements.txt pins @main, so its content (and
      # therefore Docker's cache key) never changes on its own. Pass
      # CACHEBUST=$(date +%s) when you want a fresh pull.
      args:
        CACHEBUST: "${CACHEBUST:-1}"
    restart: unless-stopped
    # Required for UPnP router discovery (SSDP multicast) — confirmed this
    # doesn't reliably work across Docker's default bridge network. Means
    # the adapter binds ARCADE_ADAPTER_PORT directly on the host, so the
    # ports: mapping below is gone (Docker ignores ports: under host
    # networking anyway).
    network_mode: host
    environment:
      ARCADE_SERVER_ID: "${ARCADE_SERVER_ID:-arcade-palworld}"
      ARCADE_SERVER_NAME: "${ARCADE_SERVER_NAME:-Palworld}"
      ARCADE_SERVER_DESCRIPTION: "${ARCADE_SERVER_DESCRIPTION:-Palworld dedicated server (arcade-palworld)}"
      ARCADE_BASE_URL: "${ARCADE_BASE_URL:-https://arcade.stanley.arpa}"
      ARCADE_ADAPTER_PORT: "${ARCADE_ADAPTER_PORT:-8300}"
      ARCADE_ADAPTER_BASE_URL: "${ARCADE_ADAPTER_BASE_URL:?set to this host's real LAN IP or *.stanley.arpa DNS name, e.g. http://adler.stanley.arpa:8300 -- auto-detection from inside a container can never see the host's real address}"
      ARCADE_HEARTBEAT_SECONDS: "${ARCADE_HEARTBEAT_SECONDS:-30}"
      ARCADE_COMPOSE_PROJECT: "${ARCADE_COMPOSE_PROJECT:-arcade-palworld}"
      ARCADE_COMPOSE_SERVICE: "${ARCADE_COMPOSE_SERVICE:-palworld}"
      ARCADE_STOP_TIMEOUT_SECONDS: "${ARCADE_STOP_TIMEOUT_SECONDS:-30}"
      # UPnP port-forwarding, tied to the palworld service's own game port.
      SERVER_PORT: "${SERVER_PORT}"
      ARCADE_FORWARD_PROTOCOL: "${ARCADE_FORWARD_PROTOCOL:-udp}"
      ARCADE_UPNP_ENABLED: "${ARCADE_UPNP_ENABLED:-true}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/homelab/certs/ca/ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
