services:
  palworld:
    image: thijsvanloef/palworld-server-docker:${PALWORLD_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      PORT: "${SERVER_PORT}"
      PLAYERS: "${PLAYERS}"
      BASE_CAMP_WORKER_MAX_NUM: "${BASE_CAMP_WORKER_MAX_NUM}"
      PLAYER_STOMACH_DECREASE_RATE: "${PLAYER_STOMACH_DECREASE_RATE}"
      PAL_STOMACH_DECREASE_RATE: "${PAL_STOMACH_DECREASE_RATE}"
      ENABLE_PERF_THREADING_ARGS: "${ENABLE_PERF_THREADING_ARGS}"
      WORKER_THREADS_SERVER: "${WORKER_THREADS_SERVER}"
      SERVER_NAME: "${SERVER_NAME}"
      SERVER_DESCRIPTION: "${SERVER_DESCRIPTION}"
      SERVER_PASSWORD: "${SERVER_PASSWORD}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      COMMUNITY: "${COMMUNITY}"
      CROSSPLAY_PLATFORMS: "${CROSSPLAY_PLATFORMS}"
      RCON_ENABLED: "${RCON_ENABLED}"
      RCON_PORT: "${RCON_PORT}"
      AUTO_UPDATE_ENABLED: "${AUTO_UPDATE_ENABLED}"
      UPDATE_ON_BOOT: "${UPDATE_ON_BOOT}"
      AUTO_PAUSE_ENABLED: "${AUTO_PAUSE_ENABLED}"
      AUTO_PAUSE_TIMEOUT_EST: "${AUTO_PAUSE_TIMEOUT_EST}"
      BACKUP_ENABLED: "${BACKUP_ENABLED}"
      BACKUP_CRON_EXPRESSION: "${BACKUP_CRON_EXPRESSION}"
      DELETE_OLD_BACKUPS: "${DELETE_OLD_BACKUPS}"
      OLD_BACKUP_DAYS: "${OLD_BACKUP_DAYS}"
    ports:
      - "${SERVER_PORT}:8211/udp"
      - "${RCON_PORT}:25575/tcp"
    volumes:
      - "${DATA_PATH}:/palworld"
      # Narrower mount over the image's own fixed internal backup path,
      # redirecting backups (BACKUP_ENABLED cron + backup_now) elsewhere
      # without touching world saves/config under DATA_PATH.
      - "${BACKUP_PATH}:/palworld/backups"

  # Scoped stand-in for a raw docker.sock mount on arcade-adapter -- see
  # AGENTS.md gotchas for why (arcade-adapter's docker.sock access is
  # otherwise root-equivalent: container create/exec both let a caller
  # mount the host root filesystem into a new privileged container).
  # Allow-lists exactly the Docker API calls lib_arcade.docker_control
  # actually makes (container list/inspect/start/stop/exec, image
  # pull+inspect for the update-available check) and nothing else --
  # container create/delete are never allow-listed, so lib-arcade's
  # `update` action (container recreate) will cleanly fail through this
  # adapter now. That's intentional: manual `docker compose pull` +
  # restart replaces it -- see the AUTO_PAUSE/update commit and AGENTS.md.
  # network_mode: host (not a custom bridge network) is deliberate: it
  # sidesteps Docker's port-publish NAT/hairpin behavior entirely, so
  # -allowfrom's default 127.0.0.1/32 (the proxy's own default, not
  # overridden here) actually matches the real connecting address instead
  # of a rewritten bridge-gateway IP -- and it means palworld (which stays
  # on the project's own bridge network, not this one) has no network path
  # to this proxy at all, not even in theory.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    network_mode: host
    user: "65534:${DOCKER_SOCKET_GID:-999}"
    read_only: true
    cap_drop:
      - ALL
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "-loglevel=info"
      # -allowGET/-allowPOST are repeatable Go flags -- each occurrence adds
      # one more allowed regex, not a numbered-suffix variant (that form is
      # for the SP_ALLOW_GET_2-style env vars only, not CLI flags).
      - '-allowGET=/version'
      - '-allowGET=/v1\..{1,2}/containers/json'
      - '-allowGET=/v1\..{1,2}/containers/[^/]+/json'
      - '-allowGET=/v1\..{1,2}/exec/[^/]+/json'
      - '-allowGET=/v1\..{1,2}/images/.+/json'
      - '-allowPOST=/v1\..{1,2}/containers/[^/]+/start'
      - '-allowPOST=/v1\..{1,2}/containers/[^/]+/stop'
      - '-allowPOST=/v1\..{1,2}/containers/[^/]+/exec'
      - '-allowPOST=/v1\..{1,2}/exec/[^/]+/start'
      - '-allowPOST=/v1\..{1,2}/images/create'

  arcade-adapter:
    build:
      context: ./arcade
      # Bust the pip-install layer to actually pick up new lib-arcade
      # commits -- requirements.txt pins @main, so its content (and
      # therefore Docker's cache key) never changes on its own. Pass
      # CACHEBUST=$(date +%s) when you want a fresh pull.
      args:
        CACHEBUST: "${CACHEBUST:-1}"
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    # Required for UPnP router discovery (SSDP multicast) — confirmed this
    # doesn't reliably work across Docker's default bridge network. Means
    # the adapter binds ARCADE_ADAPTER_PORT directly on the host, so the
    # ports: mapping below is gone (Docker ignores ports: under host
    # networking anyway).
    network_mode: host
    environment:
      ARCADE_SERVER_ID: "${ARCADE_SERVER_ID:-arcade-palworld}"
      ARCADE_SERVER_NAME: "${ARCADE_SERVER_NAME:-Palworld}"
      ARCADE_SERVER_DESCRIPTION: "${ARCADE_SERVER_DESCRIPTION:-Palworld dedicated server (arcade-palworld)}"
      ARCADE_BASE_URL: "${ARCADE_BASE_URL:-https://arcade.stanley.arpa}"
      ARCADE_ADAPTER_PORT: "${ARCADE_ADAPTER_PORT:-8300}"
      ARCADE_ADAPTER_BASE_URL: "${ARCADE_ADAPTER_BASE_URL:?set to this host's real LAN IP or *.stanley.arpa DNS name, e.g. http://adler.stanley.arpa:8300 -- auto-detection from inside a container can never see the host's real address}"
      ARCADE_HEARTBEAT_SECONDS: "${ARCADE_HEARTBEAT_SECONDS:-30}"
      ARCADE_COMPOSE_PROJECT: "${ARCADE_COMPOSE_PROJECT:-arcade-palworld}"
      ARCADE_COMPOSE_SERVICE: "${ARCADE_COMPOSE_SERVICE:-palworld}"
      ARCADE_STOP_TIMEOUT_SECONDS: "${ARCADE_STOP_TIMEOUT_SECONDS:-30}"
      # UPnP port-forwarding, tied to the palworld service's own game port.
      SERVER_PORT: "${SERVER_PORT}"
      ARCADE_FORWARD_PROTOCOL: "${ARCADE_FORWARD_PROTOCOL:-udp}"
      ARCADE_UPNP_ENABLED: "${ARCADE_UPNP_ENABLED:-true}"
      # Talks to Docker only through docker-socket-proxy above -- no raw
      # docker.sock mount on this service anymore.
      DOCKER_HOST: "tcp://127.0.0.1:${DOCKER_SOCKET_PROXY_PORT:-2375}"
    volumes:
      - /etc/homelab/certs/ca/ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
